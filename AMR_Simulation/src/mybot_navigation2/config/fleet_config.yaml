rmf_fleet:
  name: "mybot_fleet"
  fleet_state_topic_publish_period: 0.5   # seconds

  # Robot kinematic limits
  limits:
    linear:  [0.5, 0.75]    # [max velocity m/s, max acceleration m/s²]
    angular: [0.6, 2.0]     # [max angular velocity rad/s, max angular acceleration rad/s²]

  # Robot footprint for collision checking in RMF traffic schedule
  profile:
    footprint: 0.25          # radius (m) — inner circle
    vicinity: 0.4            # radius (m) — outer vicinity

  reversible: false           # can robot drive backwards?

  # Battery model (for task planning with battery awareness)
  battery_system:
    voltage: 12.0
    capacity: 10.0
    charging_current: 5.0

  # Task capabilities this fleet supports
  task_capabilities:
    loop: true
    delivery: false
    clean: false

  account_for_battery_drain: false
  recharge_threshold: 0.1
  recharge_soc: 1.0

# RMF robot configuration
robot:
  name: "mybot"
  charger_waypoint: ""       # Name of charger node in nav graph (leave empty if none)

# Nav graph (generated by building_map_generator)
nav_graph_file: "nav_graphs/0.yaml"
map_name: "Base"            # Floor name in L1.building.yaml (levels: Base)

# ROS2 topics/actions this robot uses
ros:
  odom_topic: "/odom"
  pose_topic: "/amcl_pose"
  nav2_action: "navigate_to_pose"
