collision_monitor_stop:
  ros__parameters:
    use_sim_time: false

    base_frame_id: base_link
    odom_frame_id: odom

    cmd_vel_in_topic:  /cmd_vel
    cmd_vel_out_topic: /cmd_vel_stop_out

    state_topic: collision_stop_state

    transform_tolerance: 0.1
    source_timeout: 2.0
    stop_pub_timeout: 2.0

    enable_stamped_cmd_vel: false
    base_shift_correction: false

    polygons: ["PolygonStop"]

    PolygonStop:
      type: polygon
      action_type: stop
      enabled: true
      visualize: true
      polygon_pub_topic: polygon_stop
      points: [0.75, 0.20,
               0.75, -0.20,
              -0.20, -0.20,
              -0.20, 0.20]

    observation_sources: ["scan", "scan_cam01", "scan_cam02"]

    scan:
      type: scan
      topic: /scan_filtered
      enabled: true
      source_timeout: 2.0

    scan_cam01:
      type: scan
      topic: /scan_cam01
      enabled: true
      source_timeout: 2.0

    scan_cam02:
      type: scan
      topic: /scan_cam02
      enabled: true
      source_timeout: 2.0
